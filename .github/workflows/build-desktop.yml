name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop Distribution
        run: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Prepare Installers for Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-desktop
          Get-ChildItem -Path desktop/build/compose/binaries/main -Recurse -Include *.msi, *.exe | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-desktop/$($_.Name)" -Force
              Write-Host "Found installer: $($_.FullName) -> release-desktop/$($_.Name)"
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capy-reader-windows
          path: release-desktop/*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.10.1251
          name: "Capy Reader v2026.10.1251 - AI Summary Formatting & Haptic Feedback"
          body: |
            ### Capy Reader v2026.10.1251
            
            - **AI Summary Formatting**:
              - Emphasized terms (`*word*` and `**word**`) now render in bold for prominent, clean takeaways without raw asterisks.
              - Full support for bold-italic (`***word***`), numbered lists, proportional headers, markdown links, blockquotes, and code styling.
              - Enhanced summarization prompts and audio TTS markdown cleaning.
            - **Haptic Feedback**:
              - Pleasant, subtle haptic tap feedback across all interactive icons in floating pill toolbars (Article bottom bar, feed status filter bar, mark-all-read buttons, new articles pill, and audio mini player).
            - **Upstream Sync**:
              - Synchronized with upstream v2026.10.1214.
            - **Fork Custom Features**:
              - Gemini AI article summarization & Q&A
              - Similar article deduplication with priority rules and logs
              - Thumbs down / article muting
              - Feed Health & Statistics settings panel
              - Mark as read delay settings
              - Windows Desktop app (`CapyReader-1.0.1251.msi` / `.exe`)
            
            #### Download:
            - **Android APK**: `CapyReader-2026.10.1251.apk`
            - **Windows Desktop**: `CapyReader-1.0.1251.msi` / `CapyReader-1.0.1251.exe`
          files: release-desktop/*
          prerelease: false
          draft: false
