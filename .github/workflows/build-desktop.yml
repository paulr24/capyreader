name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop Distribution
        run: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Prepare Installers for Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-desktop
          Get-ChildItem -Path desktop/build/compose/binaries/main -Recurse -Include *.msi, *.exe | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-desktop/$($_.Name)" -Force
              Write-Host "Found installer: $($_.FullName) -> release-desktop/$($_.Name)"
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capy-reader-windows
          path: release-desktop/*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.10.1249
          name: "Capy Reader v2026.10.1249 - Upstream v2026.10.1214 Sync"
          body: |
            ### Capy Reader v2026.10.1249
            
            Synchronized with upstream v2026.10.1213 while preserving all custom fork features:
            - **Upstream Updates**:
              - Native Compose Article Reader (`mallet` HTML linearizer) replacing WebView
              - Jetpack Navigation 3 & shared-axis pane transitions
              - Media3 mini audio controller
              - Native video and YouTube inline playback
              - Searchable settings registry
              - E-Ink mode improvements, per-status sort orders, and latest dependency updates
            - **Fork Custom Features**:
              - Gemini AI article summarization & Q&A
              - Similar article deduplication with priority rules and logs
              - Thumbs down / article muting
              - Feed Health & Statistics settings panel
              - Mark as read delay settings
              - Windows Desktop app (`CapyReader-1.0.1249.msi` / `.exe`)
            
            #### Download:
            - **Android APK**: `CapyReader-2026.10.1249.apk`
            - **Windows Desktop**: `CapyReader-1.0.1249.msi` / `CapyReader-1.0.1249.exe`
          files: release-desktop/*
          prerelease: false
          draft: false
