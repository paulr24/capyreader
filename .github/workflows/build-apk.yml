name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Free Debug APK
        run: ./gradlew assembleFreeDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/free/debug/*.apk release-apk/CapyReader-2026.10.1247.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.10.1247
          name: "Capy Reader v2026.10.1247 - Upstream Sync & AI Summary"
          body: |
            ### Capy Reader v2026.10.1247
            
            Synchronized with upstream v2026.10.1213 while preserving all custom fork features:
            - **Upstream Updates**:
              - Native Compose Article Reader (`mallet` HTML linearizer) replacing WebView
              - Jetpack Navigation 3 & shared-axis pane transitions
              - Media3 mini audio controller
              - Native video and YouTube inline playback
              - Searchable settings registry
              - E-Ink mode improvements, per-status sort orders, and latest dependency updates
            - **Fork Custom Features**:
              - Gemini AI article summarization & Q&A
              - Similar article deduplication with priority rules and logs
              - Thumbs down / article muting
              - Feed Health & Statistics settings panel
              - Mark as read delay settings
              - Windows Desktop app (`CapyReader-1.0.1247.msi` / `.exe`)
            
            #### Download:
            - **Android APK**: `CapyReader-2026.10.1247.apk`
            - **Windows Desktop**: `CapyReader-1.0.1247.msi` / `CapyReader-1.0.1247.exe`
          files: release-apk/CapyReader-2026.10.1247.apk
          prerelease: false
          draft: false
