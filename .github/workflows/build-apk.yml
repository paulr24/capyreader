name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Free Debug APK
        run: |
          ./gradlew assembleFreeDebug --no-daemon --stacktrace 2>&1 | tee build.log
        shell: bash

      - name: Summary on failure
        if: failure()
        run: |
          echo "### Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -C 5 -E "ERROR|FAILURE|e: " build.log | tail -n 100 >> $GITHUB_STEP_SUMMARY || tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/free/debug/*.apk release-apk/CapyReader-2026.10.1250.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.10.1250
          name: "Capy Reader v2026.10.1250 - Haptic Feedback for Toolbar Pills"
          body: |
            ### Capy Reader v2026.10.1250
            
            - **Haptic Feedback**:
              - Added pleasant, subtle haptic tap feedback across all interactive icons in floating pill toolbars (Article bottom bar, feed status filter bar, mark-all-read buttons, new articles pill, and audio mini player).
            - **Upstream Sync**:
              - Synchronized with upstream v2026.10.1214.
            - **Fork Custom Features**:
              - Gemini AI article summarization & Q&A
              - Similar article deduplication with priority rules and logs
              - Thumbs down / article muting
              - Feed Health & Statistics settings panel
              - Mark as read delay settings
              - Windows Desktop app (`CapyReader-1.0.1250.msi` / `.exe`)
            
            #### Download:
            - **Android APK**: `CapyReader-2026.10.1250.apk`
            - **Windows Desktop**: `CapyReader-1.0.1250.msi` / `CapyReader-1.0.1250.exe`
          files: release-apk/CapyReader-2026.10.1250.apk
          prerelease: false
          draft: false
