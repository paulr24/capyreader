name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Free Debug APK
        run: ./gradlew assembleFreeDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/free/debug/*.apk release-apk/CapyReader-AI-Summary.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-summary-latest
          name: "Capy Reader with AI Summarization"
          body: |
            ### Capy Reader with Gemini AI Summarization
            
            - **Default Model**: `gemini-3.5-flash-lite`
            - **Features**:
              - AI article summarization in the reader floating bar
              - Instant caching (in-memory & disk)
              - Multi-model & custom model selection
              - Configurable prompt templates in Settings
            
            #### Download:
            Download `CapyReader-AI-Summary.apk` below directly to your phone and install!
          files: release-apk/CapyReader-AI-Summary.apk
          prerelease: false
          draft: false
