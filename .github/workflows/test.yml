name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: |
          ./gradlew test --build-cache --stacktrace 2>&1 | tee test.log
        shell: bash
      - name: Summary on failure
        if: failure()
        run: |
          echo "### Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -C 5 -E "ERROR|FAILURE|e: " test.log | tail -n 100 >> $GITHUB_STEP_SUMMARY || tail -n 100 test.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash
      - name: Compile gplay flavor
        if: github.event_name == 'push'
        run: ./gradlew :app:compileGplayDebugKotlin --build-cache
      - name: Test report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: '**/build/test-results/**/TEST-*.xml'
